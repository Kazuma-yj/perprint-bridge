name: Check and build
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: python3 scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: preprint-bridge-xpi
          path: |
            dist/*.xpi
            update.json
