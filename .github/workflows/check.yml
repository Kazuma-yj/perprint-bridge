name: Check, build and release
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - name: Install browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Exercise the packaged review window
        env:
          UI_SCREENSHOT_DIR: ui-results
        run: |
          mkdir -p ui-results
          node tests/review-ui.browser.cjs > ui-results/results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-window-validation
          path: ui-results/
      - run: python3 scripts/build.py
      - run: python3 scripts/verify_package.py
      - name: Check committed package and update feed
        run: |
          package=$(node -p "'dist/preprint-bridge-' + require('./manifest.json').version + '.xpi'")
          git ls-files --error-unmatch "$package"
          git diff --exit-code -- dist update.json
      - uses: actions/upload-artifact@v4
        with:
          name: preprint-bridge-xpi
          path: |
            dist/*.xpi
            update.json
  release:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Kazuma-yj/perprint-bridge'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify and publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-release.cjs
