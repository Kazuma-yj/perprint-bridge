<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8" />
  <title>Preprint Bridge</title>
  <link rel="stylesheet" href="review.css" />
  <script src="review-ui.js" defer="defer"></script>
</head>
<body>
  <header>
    <div><p class="brand">PREPRINT BRIDGE</p><h1 id="heading"></h1><p id="intro"></p></div>
    <button id="retry" type="button"></button>
    <button id="stop" type="button" hidden="hidden"></button>
  </header>
  <div class="summary"><span id="summary" role="status" aria-live="polite"></span><button id="select-formal" type="button"></button></div>
  <main>
    <section class="queue" aria-labelledby="queue-heading"><h2 id="queue-heading"></h2><div id="rows"></div></section>
    <section id="detail" tabindex="0" aria-label="Publication details"></section>
  </main>
  <footer>
    <div><p id="policy"></p><p id="undo-note" class="muted"></p><p id="error" role="alert" hidden="hidden"></p></div>
    <div class="footer-actions"><button id="undo" type="button"></button><button id="apply" class="primary" type="button"></button></div>
  </footer>
</body>
</html>
